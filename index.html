<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Catalog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>My Recipe Catalog</h1>
        <button id="add-recipe">Add New Recipe</button>
    </header>
    <main>
        <section id="recipe-list">
            <h2>Recipes</h2>
            <div id="recipes">
                <!-- Recipes will be listed here -->
            </div>
        </section>
        <section id="recipe-form" class="hidden">
            <h2>Add New Recipe</h2>
            <form id="new-recipe-form">
                <div>
                    <label for="name">Recipe Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div>
                    <label for="ingredients">Ingredients:</label>
                    <textarea id="ingredients" required></textarea>
                </div>
                <div>
                    <label for="instructions">Instructions:</label>
                    <textarea id="instructions" required></textarea>
                </div>
                <div>
                    <label for="notes">Notes:</label>
                    <textarea id="notes"></textarea>
                </div>
                <div>
                    <label for="rating">Rating (1-5):</label>
                    <input type="number" id="rating" min="1" max="5">
                </div>
                <button type="submit">Save Recipe</button>
                <button type="button" id="cancel-form">Cancel</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
