<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Catalog</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #111113;
    --surface-2: #17171a;
    --border: #26262b;
    --text: #fafafa;
    --muted: #a1a1aa;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --danger: #ef4444;
    --radius: 0.625rem;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); }

  .shell { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem;
  }
  .topbar h1 { font-size: 1.1rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .topbar h1 .dot { color: var(--accent); }
  .brand { display: flex; align-items: center; gap: 0.5rem; }
  .brand .mark {
    width: 20px; height: 20px; border-radius: 5px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: inline-block;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.45rem 0.9rem; border-radius: var(--radius);
    font-size: 0.875rem; font-weight: 500; cursor: pointer;
    border: 1px solid transparent; transition: background .15s, border-color .15s;
    font-family: inherit; line-height: 1.4;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: transparent; color: var(--danger); border-color: rgba(239,68,68,.35); }
  .btn-danger:hover { background: rgba(239,68,68,.12); }
  .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

  input[type=text], textarea, select {
    width: 100%; padding: 0.6rem 0.75rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: inherit; font-size: 0.95rem;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,.15);
  }

  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }

  .error-banner {
    background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4);
    color: #fecaca; padding: 0.6rem 0.9rem; border-radius: var(--radius);
    margin-bottom: 1rem; font-size: 0.9rem;
  }
  .hidden { display: none !important; }

  /* ---- list ---- */
  .list-header { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 0.75rem; }
  .recipe-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .recipe-row {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.75rem 0.9rem; border-radius: var(--radius);
    border: 1px solid transparent; cursor: pointer; transition: background .12s, border-color .12s;
  }
  .recipe-row:hover { background: var(--surface-2); border-color: #2e2e34; }
  .recipe-row .thumb {
    width: 42px; height: 42px; border-radius: 8px; flex: 0 0 42px;
    background: var(--surface-2); border: 1px solid var(--border);
    object-fit: cover; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1rem; overflow: hidden;
  }
  .recipe-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .recipe-row .main { flex: 1; min-width: 0; }
  .recipe-row .title { font-weight: 550; font-size: 0.98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recipe-row .meta { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }
  .recipe-row .excerpt { font-size: 0.8rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stars { color: #fbbf24; letter-spacing: 0.05em; }

  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }
  .empty h2 { color: var(--text); font-size: 1.1rem; margin: 0 0 0.5rem; }

  /* ---- detail ---- */
  .detail-head { margin-bottom: 1.5rem; }
  .back-link { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
  .back-link:hover { color: var(--text); }
  .detail-title { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.4rem; line-height: 1.2; }
  .detail-meta { color: var(--muted); font-size: 0.85rem; display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem; }
  .detail-actions { display: flex; gap: 0.5rem; }

  .gallery { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.5rem; }
  .gallery img {
    max-width: 100%; border-radius: var(--radius); border: 1px solid var(--border);
  }
  .gallery .gthumb { height: 110px; width: auto; object-fit: cover; border-radius: var(--radius); cursor: pointer; }

  /* ---- markdown body ---- */
  .md { font-size: 0.98rem; }
  .md h1, .md h2, .md h3, .md h4 { color: var(--text); font-weight: 650; line-height: 1.3; }
  .md h1 { font-size: 1.5rem; margin: 1.6rem 0 0.6rem; }
  .md h2 { font-size: 1.25rem; margin: 1.5rem 0 0.5rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border); }
  .md h3 { font-size: 1.05rem; margin: 1.3rem 0 0.4rem; }
  .md p { margin: 0.6rem 0; }
  .md ul, .md ol { padding-left: 1.4rem; margin: 0.6rem 0; }
  .md li { margin: 0.25rem 0; }
  .md blockquote {
    margin: 0.8rem 0; padding: 0.1rem 0 0.1rem 0.9rem;
    border-left: 3px solid var(--accent); color: var(--muted);
  }
  .md code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85em; background: var(--surface-2);
    padding: 0.12rem 0.35rem; border-radius: 5px;
  }
  .md pre {
    background: var(--surface-2); padding: 0.9rem; border-radius: var(--radius);
    overflow-x: auto; border: 1px solid var(--border);
  }
  .md pre code { background: none; padding: 0; font-size: 0.85rem; }
  .md img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--border); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  .md table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  .md th, .md td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
  .md strong { font-weight: 650; }

  /* ---- editor ---- */
  .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .editor-grid .preview {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.9rem; background: var(--surface); overflow-y: auto;
    max-height: 560px;
  }
  .editor-grid textarea { min-height: 560px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 0.88rem; line-height: 1.55; }

  .upload-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.5rem; }
  .upload-grid .up-thumb { position: relative; width: 84px; height: 84px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
  .upload-grid .up-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .upload-grid .up-thumb .rm {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,.7); color: #fff; border: none; cursor: pointer; font-size: 0.75rem; line-height: 1;
  }
  .upload-note { font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; }

  /* ---- notes ---- */
  .notes-section { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
  .notes-header { font-size: 1.05rem; font-weight: 650; margin: 0 0 0.9rem; }
  .note-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .note-item:last-child { border-bottom: none; }
  .note-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; }
  .note-meta .who { color: var(--text); font-weight: 550; }
  .note-body { font-size: 0.93rem; white-space: pre-wrap; word-break: break-word; }
  .note-empty { color: var(--muted); font-size: 0.9rem; padding: 0.4rem 0; }
  .note-form { margin-top: 1.25rem; }
  .note-form .field { margin-bottom: 0.6rem; }

  @media (max-width: 640px) {
    .editor-grid { grid-template-columns: 1fr; }
    .editor-grid textarea { min-height: 300px; }
    .detail-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="shell" id="app">
  <div id="error-banner" class="error-banner hidden"></div>
</div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const errorBanner = document.getElementById('error-banner');

  let recipes = [];

  // ---------- helpers ----------
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  function showError(msg) { errorBanner.textContent = msg; errorBanner.classList.remove('hidden'); }
  function hideError() { errorBanner.classList.add('hidden'); }

  function renderMd(md) {
    try {
      const html = marked.parse(md || '');
      return DOMPurify.sanitize(html);
    } catch (e) { return '<p>' + esc(md) + '</p>'; }
  }

  function excerpt(body, len = 140) {
    let t = (body || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[#>*_`~|]/g, '')
      .replace(/\s+/g, ' ').trim();
    return t.length > len ? t.slice(0, len).trimEnd() + '…' : t;
  }

  function starsHtml(rating) {
    return rating > 0 ? ('★'.repeat(rating) + '☆'.repeat(5 - rating)) : '';
  }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
    catch (e) { return ''; }
  }

  async function http(url, opts) {
    const res = await fetch(url, opts);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || ('Request failed (' + res.status + ')'));
    }
    if (res.status === 204) return null;
    return res.json();
  }

  // ---------- router ----------
  function route() {
    const hash = decodeURIComponent(location.hash || '#/');
    const [path, id, action] = hash.replace(/^#\//, '').split('/');
    hideError();
    if (path === 'r' && id && action === 'edit') return renderEditor(Number(id));
    if (path === 'r' && id) return renderDetail(Number(id));
    if (path === 'new') return renderEditor(null);
    return renderList();
  }

  // ---------- list ----------
  function renderList() {
    const rows = recipes.map(r => {
      const thumb = (r.images && r.images.length)
        ? `<img src="${esc(r.images[0])}" alt="">`
        : '<span>🍽️</span>';
      const stars = starsHtml(r.rating);
      return `
        <div class="recipe-row" data-id="${r.id}">
          <div class="thumb">${thumb}</div>
          <div class="main">
            <div class="title">${esc(r.title)}</div>
            <div class="meta">${stars ? '<span class="stars">' + esc(stars) + '</span> · ' : ''}${esc(fmtDate(r.created_at))}${r.images.length ? ' · ' + r.images.length + ' 📷' : ''}</div>
            <div class="excerpt">${esc(excerpt(r.body))}</div>
          </div>
        </div>`;
    }).join('');

    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="mark"></span><h1>Recipe <span class="dot">Catalog</span></h1></div>
        <button class="btn btn-primary" id="new-btn">+ New recipe</button>
      </div>
      ${recipes.length
        ? `<div class="list-header">${recipes.length} recipe${recipes.length === 1 ? '' : 's'}</div><div class="recipe-list">${rows}</div>`
        : `<div class="empty"><h2>No recipes yet</h2><p>Capture your first one.</p></div>`}`;

    $('#new-btn').addEventListener('click', () => location.hash = '#/new');
    document.querySelectorAll('.recipe-row').forEach(el =>
      el.addEventListener('click', () => { location.hash = '#/r/' + el.dataset.id; }));
  }

  // ---------- detail ----------
  async function renderDetail(id) {
    const r = recipes.find(x => x.id === id);
    if (!r) { showError('Recipe not found'); return renderList(); }

    const galleryHtml = (r.images && r.images.length)
      ? `<div class="gallery">${r.images.map(p =>
          `<img class="gthumb" src="${esc(p)}" alt="" data-full="${esc(p)}">`).join('')}</div>`
      : '';

    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="mark"></span><h1>Recipe <span class="dot">Catalog</span></h1></div>
        <button class="btn btn-ghost btn-sm" data-act="list">← All recipes</button>
      </div>
      <div class="detail-head">
        <h2 class="detail-title">${esc(r.title)}</h2>
        <div class="detail-meta">
          ${r.rating > 0 ? '<span class="stars">' + esc(starsHtml(r.rating)) + '</span>' : ''}
          <span>Added ${esc(fmtDate(r.created_at))}</span>
        </div>
        <div class="detail-actions">
          <button class="btn btn-primary btn-sm" data-act="edit">Edit</button>
          <button class="btn btn-danger btn-sm" data-act="delete">Delete</button>
        </div>
      </div>
      ${galleryHtml}
      <div class="md">${renderMd(r.body)}</div>

      <section class="notes-section">
        <h3 class="notes-header">Notes</h3>
        <div id="notes-list"><div class="note-empty">Loading…</div></div>
        <form id="note-form" class="note-form">
          <div class="field">
            <input type="text" id="note-name" placeholder="Your name (optional)" maxlength="80">
          </div>
          <div class="field">
            <textarea id="note-body" rows="3" placeholder="Leave a note — a tweak, a question, how it went…"></textarea>
          </div>
          <div style="display:flex;justify-content:flex-end">
            <button type="submit" class="btn btn-primary btn-sm">Add note</button>
          </div>
        </form>
      </section>`;

    app.querySelector('[data-act="list"]').addEventListener('click', () => location.hash = '#/');
    app.querySelector('[data-act="edit"]').addEventListener('click', () => location.hash = `#/r/${id}/edit`);
    app.querySelector('[data-act="delete"]').addEventListener('click', () => deleteRecipe(r));

    // click a gallery thumb -> open full-size in new tab
    app.querySelectorAll('.gthumb').forEach(img =>
      img.addEventListener('click', () => window.open(img.dataset.full, '_blank')));

    loadNotes(id);
    app.querySelector('#note-form').addEventListener('submit', (e) => submitNote(e, id));
  }

  // ---------- notes ----------
  function renderNotes(listEl, notes) {
    if (!notes.length) {
      listEl.innerHTML = '<div class="note-empty">No notes yet — be the first.</div>';
      return;
    }
    listEl.innerHTML = notes.map(n => `
      <div class="note-item">
        <div class="note-meta"><span class="who">${esc(n.name || 'Anonymous')}</span> · ${esc(fmtDate(n.created_at))}</div>
        <div class="note-body">${esc(n.body)}</div>
      </div>`).join('');
  }

  async function loadNotes(id) {
    const listEl = document.getElementById('notes-list');
    if (!listEl) return;
    try {
      renderNotes(listEl, await http('/api/recipes/' + id + '/notes'));
    } catch (e) {
      listEl.innerHTML = '<div class="note-empty">Could not load notes.</div>';
    }
  }

  async function submitNote(e, id) {
    e.preventDefault();
    const nameEl = document.getElementById('note-name');
    const bodyEl = document.getElementById('note-body');
    const body = bodyEl.value.trim();
    if (!body) return showError("Note can't be empty");
    try {
      hideError();
      await http('/api/recipes/' + id + '/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nameEl.value.trim(), body }),
      });
      bodyEl.value = ''; // keep the name so follow-up notes are quick
      await loadNotes(id);
    } catch (err) { showError(err.message); }
  }

  async function deleteRecipe(r) {
    if (!confirm('Delete "' + r.title + '"?')) return;
    try {
      await http('/api/recipes/' + r.id, { method: 'DELETE' });
      location.hash = '#/';
      await load();
    } catch (e) { showError(e.message); }
  }

  // ---------- editor ----------
  function renderEditor(id) {
    const r = id ? recipes.find(x => x.id === id) : null;

    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="mark"></span><h1>Recipe <span class="dot">Catalog</span></h1></div>
        <button class="btn btn-ghost btn-sm" data-act="cancel">Cancel</button>
      </div>
      <h2 class="detail-title" style="font-size:1.4rem;margin-bottom:1.2rem">${r ? 'Edit recipe' : 'New recipe'}</h2>

      <div class="field">
        <label for="in-title">Title</label>
        <input type="text" id="in-title" placeholder="e.g. Sichuan Chili Oil × Tadka Chicken" value="${esc(r ? r.title : '')}">
      </div>

      <div class="field">
        <label for="in-rating">Rating</label>
        <select id="in-rating">
          <option value="0">No rating</option>
          ${[1,2,3,4,5].map(n => `<option value="${n}" ${r && r.rating === n ? 'selected' : ''}>${n} star${n > 1 ? 's' : ''}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label>Photos</label>
        <input type="file" id="in-images" accept="image/*" multiple>
        <div class="upload-grid" id="upload-grid"></div>
        <div class="upload-note">Drag images here is coming — for now use the file picker. Stored to your account.</div>
      </div>

      <div class="field">
        <label for="in-body">Recipe (Markdown)</label>
        <div class="editor-grid">
          <textarea id="in-body" placeholder="# Ingredients&#10;&#10;- first thing&#10;- second thing&#10;&#10;## Instructions&#10;&#10;1. step one&#10;2. step two">${esc(r ? r.body : '')}</textarea>
          <div class="preview md" id="md-preview"></div>
        </div>
      </div>

      <div style="display:flex;gap:0.6rem;justify-content:flex-end">
        <button class="btn btn-ghost" data-act="cancel">Cancel</button>
        <button class="btn btn-primary" data-act="save">${r ? 'Save changes' : 'Create recipe'}</button>
      </div>`;

    const bodyEl = $('#in-body');
    const previewEl = $('#md-preview');
    const preview = () => { previewEl.innerHTML = renderMd(bodyEl.value); };
    bodyEl.addEventListener('input', preview);
    preview();

    // image upload state (accumulated during editing)
    let images = (r && r.images) ? r.images.slice() : [];

    const redrawThumbs = () => {
      $('#upload-grid').innerHTML = images.map((p, i) =>
        `<div class="up-thumb"><img src="${esc(p)}" alt=""><button class="rm" data-i="${i}">×</button></div>`
      ).join('');
      document.querySelectorAll('.rm').forEach(b =>
        b.addEventListener('click', () => { images.splice(Number(b.dataset.i), 1); redrawThumbs(); }));
    };
    redrawThumbs();

    $('#in-images').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const fd = new FormData();
      files.forEach(f => fd.append('images', f));
      try {
        hideError();
        const data = await http('/api/uploads', { method: 'POST', body: fd });
        images = images.concat(data.images);
        redrawThumbs();
      } catch (err) { showError('Upload failed: ' + err.message); } finally {
        e.target.value = '';
      }
    });

    app.querySelector('[data-act="cancel"]').addEventListener('click', () =>
      location.hash = id ? `#/r/${id}` : '#/');
    app.querySelector('[data-act="save"]').addEventListener('click', async () => {
      const title = $('#in-title').value.trim();
      const body = bodyEl.value.trim();
      const rating = parseInt($('#in-rating').value, 10) || 0;
      if (!title) return showError('Please add a title');
      if (!body) return showError('Please write the recipe (markdown)');
      const payload = { title, body, rating, images };
      try {
        hideError();
        await http(id ? '/api/recipes/' + id : '/api/recipes', {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        location.hash = id ? `#/r/${id}` : '#/';
        await load();
      } catch (e) { showError(e.message); }
    });
  }

  // ---------- boot ----------
  async function load() {
    try {
      recipes = await http('/api/recipes');
    } catch (e) {
      showError('Could not load recipes: ' + e.message);
      recipes = [];
    }
    route();
  }

  window.addEventListener('hashchange', route);
  load();
})();
</script>
</body>
</html>
