<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Catalog</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background-color: #334155; }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        .btn-danger:hover { background-color: #dc2626; }

        .card {
            background-color: var(--bg-card);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        .form-group { margin-bottom: 1rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.375rem;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: inherit;
            box-sizing: border-box;
        }

        textarea { min-height: 100px; resize: vertical; }

        .hidden { display: none; }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .recipe-card h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.25rem;
        }

        .recipe-section { margin-bottom: 1rem; }

        .recipe-section h4 {
            margin: 0 0 0.5rem 0;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .recipe-section p {
            margin: 0;
            white-space: pre-line;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .stars { color: #fbbf24; font-size: 1.25rem; }

        .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-secondary); }
        .empty-state h2 { color: var(--text-primary); margin-bottom: 1rem; }

        .error-banner {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fecaca;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .recipe-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Recipe Catalog</h1>
            <button id="add-recipe" class="btn btn-primary">Add New Recipe</button>
        </header>

        <main>
            <div id="error-banner" class="error-banner hidden"></div>

            <section id="recipe-form" class="card hidden">
                <h2 id="form-title">Add New Recipe</h2>
                <form id="recipe-form-el">
                    <div class="form-group">
                        <label for="title">Recipe Name</label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group">
                        <label for="ingredients">Ingredients</label>
                        <textarea id="ingredients" placeholder="List ingredients, one per line&#10;• 2 cups flour&#10;• 1 cup sugar&#10;• 3 eggs" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="instructions">Instructions</label>
                        <textarea id="instructions" placeholder="Step-by-step instructions&#10;1. Preheat oven to 350°F&#10;2. Mix dry ingredients&#10;3. Add wet ingredients" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes / Iterations</label>
                        <textarea id="notes" placeholder="Tips, modifications, tasting observations, or what to change next time"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="rating">Rating (1-5 stars)</label>
                        <select id="rating">
                            <option value="0">No rating</option>
                            <option value="1">1 star</option>
                            <option value="2">2 stars</option>
                            <option value="3">3 stars</option>
                            <option value="4">4 stars</option>
                            <option value="5">5 stars</option>
                        </select>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Save Recipe</button>
                        <button type="button" id="cancel-form" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </section>

            <section id="recipe-list">
                <h2>Your Recipes</h2>
                <div id="recipes" class="recipe-grid"></div>
            </section>
        </main>
    </div>

    <script>
        const recipeList = document.getElementById('recipes');
        const recipeFormSection = document.getElementById('recipe-form');
        const recipeFormEl = document.getElementById('recipe-form-el');
        const addRecipeButton = document.getElementById('add-recipe');
        const cancelFormButton = document.getElementById('cancel-form');
        const formTitle = document.getElementById('form-title');
        const errorBanner = document.getElementById('error-banner');

        let recipes = [];
        let editingId = null;

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.remove('hidden');
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }

        async function loadRecipes() {
            hideError();
            try {
                const res = await fetch('/api/recipes');
                if (!res.ok) throw new Error('Failed to load recipes');
                recipes = await res.json();
                displayRecipes();
            } catch (err) {
                showError('Could not load recipes: ' + err.message);
            }
        }

        function displayRecipes() {
            recipeList.innerHTML = '';

            if (recipes.length === 0) {
                recipeList.innerHTML = `
                    <div class="empty-state">
                        <h2>No recipes yet</h2>
                        <p>Start by adding your first recipe!</p>
                    </div>
                `;
                return;
            }

            recipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'card recipe-card';

                const stars = recipe.rating > 0
                    ? '★'.repeat(recipe.rating) + '☆'.repeat(5 - recipe.rating)
                    : '';

                card.innerHTML = `
                    <h3>${escapeHtml(recipe.title)}</h3>

                    <div class="recipe-section">
                        <h4>Ingredients</h4>
                        <p>${escapeHtml(recipe.ingredients)}</p>
                    </div>

                    <div class="recipe-section">
                        <h4>Instructions</h4>
                        <p>${escapeHtml(recipe.instructions)}</p>
                    </div>

                    ${recipe.notes ? `
                    <div class="recipe-section">
                        <h4>Notes / Iterations</h4>
                        <p>${escapeHtml(recipe.notes)}</p>
                    </div>` : ''}

                    ${stars ? `
                    <div class="recipe-section">
                        <h4>Rating</h4>
                        <div class="stars">${stars}</div>
                    </div>` : ''}

                    <div class="actions">
                        <button data-edit="${recipe.id}" class="btn btn-secondary">Edit</button>
                        <button data-delete="${recipe.id}" class="btn btn-danger">Delete</button>
                    </div>
                `;
                recipeList.appendChild(card);
            });

            document.querySelectorAll('[data-edit]').forEach(btn =>
                btn.addEventListener('click', () => editRecipe(Number(btn.dataset.edit))));
            document.querySelectorAll('[data-delete]').forEach(btn =>
                btn.addEventListener('click', () => deleteRecipe(Number(btn.dataset.delete))));
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function showForm() {
            recipeFormSection.classList.remove('hidden');
            formTitle.textContent = 'Add New Recipe';
            document.getElementById('title').focus();
        }

        function hideForm() {
            recipeFormSection.classList.add('hidden');
            recipeFormEl.reset();
            editingId = null;
        }

        function editRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;
            editingId = id;
            document.getElementById('title').value = recipe.title;
            document.getElementById('ingredients').value = recipe.ingredients;
            document.getElementById('instructions').value = recipe.instructions;
            document.getElementById('notes').value = recipe.notes;
            document.getElementById('rating').value = recipe.rating;
            formTitle.textContent = 'Edit Recipe';
            recipeFormSection.classList.remove('hidden');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            hideError();

            const payload = {
                title: document.getElementById('title').value,
                ingredients: document.getElementById('ingredients').value,
                instructions: document.getElementById('instructions').value,
                notes: document.getElementById('notes').value,
                rating: parseInt(document.getElementById('rating').value, 10) || 0,
            };

            try {
                const res = await fetch(editingId ? `/api/recipes/${editingId}` : '/api/recipes', {
                    method: editingId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || 'Save failed');
                }
                hideForm();
                await loadRecipes();
            } catch (err) {
                showError('Could not save: ' + err.message);
            }
        }

        async function deleteRecipe(id) {
            if (!confirm('Are you sure you want to delete this recipe?')) return;
            hideError();
            try {
                const res = await fetch(`/api/recipes/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Delete failed');
                await loadRecipes();
            } catch (err) {
                showError('Could not delete: ' + err.message);
            }
        }

        addRecipeButton.addEventListener('click', showForm);
        cancelFormButton.addEventListener('click', hideForm);
        recipeFormEl.addEventListener('submit', handleSubmit);

        loadRecipes();
    </script>
</body>
</html>
